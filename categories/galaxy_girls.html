<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤걸 - catfiesta</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #111318;
    color: #eaeaf0;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid #2a2d36;
  }
  .home-btn {
    color: #eaeaf0;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 6px 12px;
    border: 1px solid #3a3d46;
    border-radius: 8px;
  }
  .home-btn:hover {
    background: #1c1f27;
  }
  header h1 {
    margin: 0;
    font-size: 1.2rem;
    color: #cfd2e0;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  main.empty {
    max-width: 700px;
    padding: 40px 20px;
    text-align: center;
  }
  main p {
    color: #9a9db0;
    line-height: 1.6;
  }
  h2 {
    margin: 32px 0 12px;
    font-size: 1.1rem;
    color: #cfd2e0;
    border-bottom: 1px solid #2a2d36;
    padding-bottom: 6px;
  }
  h2:first-child {
    margin-top: 0;
  }
  .chars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2d36;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .card .name {
    font-size: 0.85rem;
    font-weight: bold;
    color: #eaeaf0;
    margin-bottom: 8px;
    word-break: keep-all;
  }
  .forms {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
  }
  .forms img {
    width: 64px;
    height: auto;
  }
  main.wide {
    max-width: 1100px;
  }
  .pairs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
    gap: 12px;
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 6px;
    background: #15181e;
    border-radius: 12px;
  }
  @media (max-width: 560px) {
    .pair {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
